
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore the professional portfolio of a Full Stack Developer and UI/UX Designer."
    >

    <meta name="theme-color" content="#344e41">

    <title>Home | John Myro N. Garcia</title>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="home">

    <!-- Shared navigation is generated by script.js -->
    <div id="site-header"></div>

    <!-- Home page content is generated from data.js -->
    <main
        id="page-content"
        class="page-transition"
        data-page-content
    >
        <noscript>
            <p>
                Please enable JavaScript to view this portfolio website.
            </p>
        </noscript>
    </main>

    <!-- Shared footer is generated by script.js -->
    <div id="site-footer"></div>

    <!-- Load portfolio data before the application script -->
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
